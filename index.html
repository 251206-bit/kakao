<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* CSS: 화면 레이아웃 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 메인 컨테이너: 왼쪽과 오른쪽 2분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바 (검색 및 결과) */
        .sidebar {
            width: 350px;
            padding: 20px;
            background-color: #f8f9fa;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search-box button {
            width: 25%;
            padding: 10px;
            background-color: #ffeb3b; /* 카카오 노란색 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #result-list {
            list-style: none;
        }

        #result-list li {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        #result-list li:hover {
            background-color: #e9ecef;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex-grow: 1; /* 남은 영역을 모두 차지 */
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <h2>📍 장소 검색</h2>
            <hr style="margin: 15px 0;">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="장소를 입력하세요">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="result-list">
                </ul>
        </div>

        <div id="map"></div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=efddfb39f59d8f50b40de5655470573d&libraries=services"></script>

    <script>
        // JS: 지도 생성 및 기능 구현
        const mapContainer = document.getElementById('map'); 
        const mapOptions = {
            center: new kakao.maps.LatLng(37.66, 126.83), // 학교 위치 (위도, 경도)
            level: 5 // 확대 레벨
        };

        // 지도 객체 생성
        const map = new kakao.maps.Map(mapContainer, mapOptions);

        // 장소 검색 객체 생성
        const placeService = new kakao.maps.services.Places();

        // 검색 버튼을 눌렀을 때 실행되는 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return;
            }

            // 카카오 검색 서비스 이용
            placeService.keywordSearch(keyword, placesSearchCB);
        }

        // 검색 결과 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 목록과 마커를 표시하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('result-list');
            const bounds = new kakao.maps.LatLngBounds();
            
            // 기존 결과 삭제
            listEl.innerHTML = '';

            for (let i = 0; i < places.length; i++) {
                // 마커 위치 객체 생성
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 마커 생성 및 지도에 표시
                const marker = new kakao.maps.Marker({
                    position: placePosition,
                    map: map
                });

                // 목록 아이템 생성
                const itemEl = document.createElement('li');
                itemEl.innerHTML = `<strong>${places[i].place_name}</strong><br><small>${places[i].address_name}</small>`;
                
                // 목록 클릭 시 지도를 해당 위치로 이동
                itemEl.onclick = function() {
                    map.setCenter(placePosition);
                    map.setLevel(3);
                };

                listEl.appendChild(itemEl);
                bounds.extend(placePosition);
            }

            // 검색된 장소들이 다 보이도록 지도 범위 조정
            map.setBounds(bounds);
        }

        // 위치 권한 요청 (Geolocation API)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                // 권한 허용 시 사용자 현재 위치로 중심 이동 (선택 사항)
                // const lat = position.coords.latitude;
                // const lon = position.coords.longitude;
                // const locPosition = new kakao.maps.LatLng(lat, lon);
                // map.setCenter(locPosition);
            });
        }
    </script>
</body>
</html>

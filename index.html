<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 카카오맵 검색 서비스</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=efddfb39f59d8f50b40de5655470573d&libraries=services"></script>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 메인 컨테이너: 왼쪽 리스트와 오른쪽 지도를 나눔 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바 (검색창 및 결과) */
        .sidebar {
            width: 350px;
            height: 100%;
            background: #f8f9fa;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #resultList {
            flex-grow: 1;
            overflow-y: auto;
            list-style: none;
        }

        .result-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #e9ecef;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex-grow: 1;
            height: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="search-box">
            <h2>장소 검색</h2>
            <input type="text" id="keyword" placeholder="검색어를 입력하세요 (예: 강남역)">
        </div>
        <ul id="resultList">
            </ul>
    </div>

    <div id="map"></div>
</div>

<script>
    // 전역 변수 설정
    let map;
    let marker;

    // 페이지 로드 시 실행
    window.onload = function() {
        initMap();
    };

    // 지도 초기화 함수
    function initMap() {
        const mapContainer = document.getElementById('map'); // 지도를 표시할 div
        const mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 임시 중심 좌표 (서울시청)
            level: 5 // 확대 레벨
        };

        // 지도 생성
        map = new kakao.maps.Map(mapContainer, mapOption);

        // 현재 위치 가져오기 (Geolocation)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude; // 위도
                const lon = position.coords.longitude; // 경도
                
                const locPosition = new kakao.maps.LatLng(lat, lon); // 좌표 객체 생성
                
                displayMarker(locPosition); // 현재 위치에 마커 표시
                map.setCenter(locPosition); // 지도의 중심을 현재 위치로 이동
            }, function(error) {
                console.error("위치 정보를 가져올 수 없습니다.", error);
                alert("위치 권한을 허용해주세요.");
            });
        } else {
            alert("이 브라우저에서는 위치 정보를 사용할 수 없습니다.");
        }
    }

    // 마커 표시 함수
    function displayMarker(locPosition) {
        // 기존 마커가 있다면 제거 (중복 방지)
        if (marker) {
            marker.setMap(null);
        }

        // 새로운 마커 생성
        marker = new kakao.maps.Marker({
            map: map,
            position: locPosition
        });
    }

    // [참고] 검색 기능은 추가 확장을 위해 'keyword' 입력 후 엔터 시 동작하는 로직을 넣을 수 있습니다.
    document.getElementById('keyword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const ps = new kakao.maps.services.Places(); // 장소 검색 객체
            const searchKeyword = this.value;

            if (!searchKeyword.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return false;
            }

            // 키워드로 장소검색을 요청합니다
            ps.keywordSearch(searchKeyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const listEl = document.getElementById('resultList');
                    listEl.innerHTML = ''; // 기존 목록 초기화

                    const bounds = new kakao.maps.LatLngBounds();

                    for (let i = 0; i < data.length; i++) {
                        const itemEl = document.createElement('li');
                        itemEl.className = 'result-item';
                        itemEl.innerHTML = `<strong>${data[i].place_name}</strong><br><small>${data[i].address_name}</small>`;
                        
                        // 결과 클릭 시 해당 위치로 이동
                        const placePos = new kakao.maps.LatLng(data[i].y, data[i].x);
                        itemEl.onclick = function() {
                            map.setCenter(placePos);
                            displayMarker(placePos);
                        };

                        listEl.appendChild(itemEl);
                        bounds.extend(placePos);
                    }
                    // 검색된 장소들이 다 보이도록 지도 범위 조정
                    map.setBounds(bounds);
                }
            });
        }
    });
</script>

</body>
</html>

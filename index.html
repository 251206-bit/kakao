<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핑키 리본 장소 검색</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=efddfb39f59d8f50b40de5655470573d&libraries=services"></script>
    <style>
        /* 헬로키티 테마 컬러 정의 */
        :root {
            --kitty-pink: #FFB7D5;
            --kitty-dark-pink: #FF85B2;
            --kitty-white: #FFFFFF;
            --kitty-border: #FFD1E3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--kitty-white);
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바: 분홍분홍한 스타일 */
        .sidebar {
            width: 380px;
            height: 100%;
            background: #FFF9FB;
            border-right: 5px solid var(--kitty-pink);
            display: flex;
            flex-direction: column;
            padding: 25px;
            z-index: 10;
            box-shadow: 5px 0 15px rgba(255, 183, 213, 0.3);
        }

        .search-box h2 {
            color: var(--kitty-dark-pink);
            font-size: 24px;
            margin-bottom: 15px;
            text-align: center;
            /* 리본 느낌을 주기 위한 텍스트 장식 */
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px var(--kitty-border);
        }

        .search-box input {
            width: 100%;
            padding: 15px;
            border: 3px solid var(--kitty-pink);
            border-radius: 30px; /* 둥글둥글하게 */
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--kitty-dark-pink);
            box-shadow: 0 0 10px var(--kitty-pink);
        }

        /* 결과 리스트 스타일 */
        #resultList {
            flex-grow: 1;
            margin-top: 20px;
            overflow-y: auto;
            list-style: none;
        }

        .result-item {
            padding: 15px;
            margin-bottom: 10px;
            background: #fff;
            border: 2px solid var(--kitty-border);
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .result-item:hover {
            background-color: var(--kitty-pink);
            color: white;
            transform: scale(1.02);
        }

        .result-item strong {
            display: block;
            margin-bottom: 5px;
        }

        /* 오른쪽 지도 */
        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* 스크롤바 커스텀 */
        #resultList::-webkit-scrollbar {
            width: 8px;
        }
        #resultList::-webkit-scrollbar-thumb {
            background: var(--kitty-pink);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="search-box">
            <h2>🎀 장소 검색 🎀</h2>
            <input type="text" id="keyword" placeholder="어디로 가고 싶어?">
        </div>
        <ul id="resultList">
            </ul>
    </div>
    <div id="map"></div>
</div>

<script>
    let map;
    let marker;

    // 지도가 로드되지 않는 문제를 방지하기 위해 Kakao SDK가 준비된 후 실행
    kakao.maps.load(function() {
        initMap();
    });

    function initMap() {
        const mapContainer = document.getElementById('map');
        const mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 5
        };

        map = new kakao.maps.Map(mapContainer, mapOption);

        // 내 위치 찾기
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const locPosition = new kakao.maps.LatLng(lat, lon);
                
                displayMarker(locPosition);
                map.setCenter(locPosition);
            }, function(error) {
                console.log("위치 차단됨: 기본 서울시청을 보여줍니다.");
            });
        }
    }

    function displayMarker(locPosition) {
        if (marker) marker.setMap(null);

        // 마커 이미지를 커스텀할 수도 있지만, 일단 기본 마커로 설정
        marker = new kakao.maps.Marker({
            map: map,
            position: locPosition
        });
    }

    // 검색 로직
    document.getElementById('keyword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const ps = new kakao.maps.services.Places();
            const searchKeyword = this.value;

            if (!searchKeyword.trim()) {
                alert('검색어를 입력해줘! 🎀');
                return;
            }

            ps.keywordSearch(searchKeyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const listEl = document.getElementById('resultList');
                    listEl.innerHTML = ''; 

                    const bounds = new kakao.maps.LatLngBounds();

                    data.forEach(place => {
                        const itemEl = document.createElement('li');
                        itemEl.className = 'result-item';
                        itemEl.innerHTML = `<strong>📍 ${place.place_name}</strong><small>${place.address_name}</small>`;
                        
                        const placePos = new kakao.maps.LatLng(place.y, place.x);
                        itemEl.onclick = function() {
                            map.setCenter(placePos);
                            displayMarker(placePos);
                        };

                        listEl.appendChild(itemEl);
                        bounds.extend(placePos);
                    });
                    map.setBounds(bounds);
                } else {
                    alert('검색 결과가 없어... 😿');
                }
            });
        }
    });
</script>

</body>
</html>
